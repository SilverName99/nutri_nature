  <path d="M12 7v7"/>
  <path d="M12 9 7 5.5M12 9l5-3.5"/>
  <path d="M12 14l-3 7M12 14l3 7"/>
</symbol>

<symbol id="clepsidra" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <title>Timp</title>
  <path d="M7 3h10M7 21h10"/>
  <path d="M8 3v3.5c0 2 4 3.8 4 5.5 0-1.7 4-3.5 4-5.5V3"/>
  <path d="M8 21v-3.5c0-2 4-3.8 4-5.5 0 1.7 4 3.5 4 5.5V21"/>
