  <path d="M12 19c-2.5 0-4.5-2.4-4.5-6.5C7.5 8.4 9.5 6 12 6s4.5 2.4 4.5 6.5C16.5 16.6 14.5 19 12 19z"/>
  <path d="M12 19c-4 0-7-2-8.5-5 3-1.4 5.6-.9 7.6 1.4"/>
  <path d="M12 19c4 0 7-2 8.5-5-3-1.4-5.6-.9-7.6 1.4"/>
