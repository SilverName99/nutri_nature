<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!--
  Pictogramele NutriNature.

  Afișele clientului au un limbaj de iconițe consecvent: linie subțire aurie,
  desen simplu, fără umplere. Decupate din afiș ar fi ieșit imagini de 60 de
  pixeli, cu fundal crem lipit de ele și imposibil de recolorat. Redesenate ca
  SVG, sunt curate la orice mărime, iau culoarea textului din jur („currentColor")
  și cântăresc câțiva kiloocteți la un loc.

  Se folosesc așa:
      <svg class="pictograma" aria-hidden="true"><use href="/assets/img/pictograme.svg#frunza"></use></svg>

  Toate au caseta 24x24 și grosimea liniei 1.5, ca să arate ca o familie.
-->
<defs>
  <g id="baza" fill="none" stroke="currentColor" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round"></g>
</defs>

<symbol id="frunza" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <title>Frunză</title>
  <path d="M20 4c0 8-5 13-12 13H5c0-8 5-13 12-13h3z"/>
  <path d="M4 20c3-4 6-6 10-8"/>
</symbol>

<symbol id="bol-cu-frunze" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <title>Bol cu plante</title>
  <path d="M3 13h18a9 9 0 0 1-9 8 9 9 0 0 1-9-8z"/>
  <path d="M12 10c0-3 2-5 5-5 0 3-2 5-5 5z"/>
  <path d="M12 10c0-2.5-1.7-4.5-4.5-4.5C7.5 8 9.4 10 12 10z"/>
  <path d="M12 10v3"/>
</symbol>

<symbol id="coloana" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <title>Coloană vertebrală</title>
  <path d="M12 3v18"/>
  <path d="M9 5.5h6M8.5 9h7M8.5 12.5h7M9 16h6M9.5 19h5"/>
</symbol>

<symbol id="maini" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <title>Mâini</title>
  <path d="M7 20V9.5a1.5 1.5 0 0 1 3 0V13"/>
  <path d="M10 12V7.5a1.5 1.5 0 0 1 3 0V12"/>
  <path d="M13 12V9a1.5 1.5 0 0 1 3 0v5.5c0 3.6-2 5.5-4.8 5.5H10c-1.9 0-3-1.1-3-3"/>
</symbol>

<symbol id="mojar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <title>Mojar și pistil</title>
  <path d="M4 12h16a8 8 0 0 1-8 8 8 8 0 0 1-8-8z"/>
  <path d="M9 20h6"/>
  <path d="M15 3l-4 8"/>
  <circle cx="16" cy="3.5" r="1.4"/>
</symbol>

<symbol id="copac" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <title>Copac</title>
  <path d="M12 21v-7"/>
  <path d="M12 14 8.5 10.5M12 16.5l3.5-3.5"/>
  <circle cx="12" cy="7.5" r="4.5"/>
</symbol>

<symbol id="unde" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <title>Unde</title>
  <path d="M2 12c1.6-4 3.2-6 4.8-6S9.9 8 11.5 12s3.2 6 4.8 6 3.2-2 4.8-6"/>
</symbol>

<symbol id="cap-si-frunza" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
